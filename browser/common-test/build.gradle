plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

publishing {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())

    publications {
        release(MavenPublication) {
            groupId = 'com.mangala.wallet.browser'
            artifactId = project.name
            version = '1.0'

            afterEvaluate {
                from components.release
            }
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/MangalaLabs/mangala-dependencies")
            credentials {
                username = properties.getProperty("GITHUB_ACTOR")
                password = properties.getProperty("GITHUB_TOKEN")
            }
        }
    }
}

apply from: "$rootProject.projectDir/gradle/android-library.gradle"

dependencies {

    // Dependencies for this Module
    implementation "com.mangala.wallet.browser:common:1.0"

    implementation libs.rxAndroid
    implementation libs.rxJava
    implementation("com.squareup.okhttp3:okhttp:4.10.0")
    implementation libs.kotlinx.coroutines.core
    // api because TestDispatcher is in the CoroutineTestRule public API
//    api (KotlinX.coroutines.test) {
//        // https://github.com/Kotlin/kotlinx.coroutines/issues/2023
//        // conflicts with mockito due to direct inclusion of byte buddy
//        exclude group: "org.jetbrains.kotlinx", module: "kotlinx-coroutines-debug"
//    }
//    implementation Testing.junit4

}


android {
    namespace 'com.mangala.app.test'
}